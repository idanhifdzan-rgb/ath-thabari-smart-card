<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ATH-THABARI SMART CARD</title>
  <script src="https://unpkg.com/html5-qrcode"></script>
  <style>
    body {
      font-family: Arial;
      background: #eef4fa;
      text-align: center;
      padding: 15px;
    }
    .card {
      background: white;
      padding: 20px;
      border-radius: 15px;
      max-width: 450px;
      margin: auto;
    }
    h2 { color: #0876c9; }
    #reader { width: 100%; margin-top: 20px; }
    #hasil {
      font-size: 22px;
      font-weight: bold;
      color: green;
      margin-top: 20px;
    }
  </style>
</head>
<body>
  <div class="card">
    <h2>ATH-THABARI<br>SMART CARD</h2>
    <p>PEMINDAIAN QR SANTRI</p>
    <div id="reader"></div>
    <div id="hasil">Arahkan QR santri ke kamera.</div>
  </div>

  <script>
    function berhasil(kode) {
      document.getElementById("hasil").innerText =
        "QR TERBACA: " + kode;
    }

    const scanner = new Html5QrcodeScanner(
      "reader",
      {
        fps: 10,
        qrbox: { width: 250, height: 250 }
      },
      false
    );

    scanner.render(berhasil);
  </script>
</body>
</html>
